services:
  api:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
    ports: ['127.0.0.1:8000:8000']
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
